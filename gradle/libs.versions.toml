[versions]
agp = "8.13.2"

appcompat = "1.7.1"
constraintlayout = "2.2.1"
desugar_jdk_libs = "2.1.5"
material = "1.13.0"
legacySupport = "1.0.0"
recyclerview = "1.4.0"
vectordrawable = "1.2.0"
preference = "1.2.1"

junit4 = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
kotlin = "2.3.0"
coreKtx = "1.17.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar_jdk_libs" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-legacy-support = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacySupport" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-vectordrawable = { module = "androidx.vectordrawable:vectordrawable", version.ref = "vectordrawable" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }

junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
